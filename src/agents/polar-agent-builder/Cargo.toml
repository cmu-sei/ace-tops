[package]
name = "polar-agent-builder"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
async-trait.workspace = true
# The broker reads a floor from the certificate the TLS handshake gives as DER; the extractors read PEM.
base64.workspace = true
cassini-client.workspace = true
cassini-types.workspace = true
credentials_agent_common.workspace = true
cert-issuer-common = { path = "../cert-issuer/common" }
polar.workspace = true
polar-crypto.workspace = true
# The credentials section: judging that a secret is an escrowed one, and what it was bound to.
polar-escrow.workspace = true
polar-env = { workspace = true, features = ["document"] }
http-auth.workspace = true
serde.workspace = true
polar-health = { path = "../polar-health" }
polar-router.workspace = true
polar-permissions.workspace = true
polar-policy.workspace = true
polar-scheduler-common.workspace = true
polar-topics.workspace = true
# The state agent's questions and answers, which the state actor asks and hears (state.rs).
soft-state-common.workspace = true
polar-signing.workspace = true
# The evidence records an agent sends the git server, and its answers (src/recorder.rs).
polar-git-server-common.workspace = true
# The signer asks the custody daemon to sign the agent's evidence records with the pod's signing key (signer.rs).
polar-custody.workspace = true
# The signer puts a record's signature, which the custody daemon gives as DER, in the fixed form polar-signing reads.
p256.workspace = true
# What `--version` prints and the scaffold carries as `agent.version`.
polar-version.workspace = true
rand.workspace = true
# The HTTP protocol handler. Its default backend, native-tls, is what the image's trust roots are for (polar::egress).
reqwest.workspace = true
# The git protocol handler. A protocol is linked only into an agent that names it in an operation (`ProtocolKind`).
git2.workspace = true
# git over https: gix fetches, through an HTTP implementation whose requests the CryptoActor sends (protocol/git/https.rs).
# libgit2 still fetches over ssh, until custody signs for an ssh key, and reads what was fetched.
gix = { workspace = true, features = ["blocking-network-client"] }
gix-transport.workspace = true
# The Kubernetes protocol handler, under the same rule. `kube`'s TLS asks for a rustls provider, chosen as the rest of the
# workspace chooses it; k8s-openapi says what a watched type is called, for an agent that reads that type.
futures.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
rustls.workspace = true
# Reads a Retry-After given as an HTTP date.
chrono.workspace = true
rsa.workspace = true
ractor.workspace = true
rkyv.workspace = true
serde_json.workspace = true
# A held section's digest, in what an agent answers of its configuration in force.
sha2.workspace = true
thiserror.workspace = true
# The worker: fork, its lockdown by prctl and seccomp's strict mode, its pipes (src/worker.rs).
libc.workspace = true
tokio.workspace = true
tracing.workspace = true
# A stand-in git server for the tests of an agent (`protocol::testing`).
wiremock = { workspace = true, optional = true }

[features]
# A protocol handler for the tests of an agent, given its credentials by the test (`protocol::testing`).
testing = ["dep:wiremock", "polar/testing"]

[dev-dependencies]
# What polar-sign writes from an answer, signed unchanged, keeps what is running (running.rs).
polar-sign = { path = "../polar-sign" }
# Test CAs, and TLS in front of a stand-in site (polar::egress::testing).
polar = { workspace = true, features = ["testing"] }
wiremock.workspace = true
polar-signing = { workspace = true, features = ["testing"] }
polar-health = { path = "../polar-health", features = ["virtual-time"] }
proptest.workspace = true
# A witness's co-signature, opened as a reader opens one (infrastructure.rs).
polar-log.workspace = true
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
# An ssh server for the git handler's fetch over ssh.
russh.workspace = true
# A real Neo4j for the graph controller's drain at the end (infrastructure.rs).
polar-test-graph.workspace = true

# A worker is forked only from a process of one thread, and libtest runs tests on threads of its own: its tests are one
# binary with a main of its own.
[[test]]
name = "worker"
harness = false
