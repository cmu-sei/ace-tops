[package]
name = "polar-projection"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Cypher's rule for a name, the one the graph controller holds every query to, so a mapping is refused for it before it is signed.
polar-cypher.workspace = true
# Only for turning writes into graph operations. The tool that signs a mapping has no use for a graph, or a runtime.
polar = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }

[features]
graph = ["dep:polar"]
# Strategies for other crates' property tests: any valid mapping, with its schema, and documents in its words.
testing = ["dep:proptest"]

[dev-dependencies]
proptest.workspace = true
# The example is read as an author's file is.
serde_dhall.workspace = true
