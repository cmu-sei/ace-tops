[package]
name = "polar-registry"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Nix's formats (docs/plans/registry/nix-cache.md).
polar-registry-nix = { path = "../nix" }
# Blobs kept compressed, named by their plain content.
structured-zstd.workspace = true
# The Nix face, over HTTP.
axum = "0.7"
tokio.workspace = true
tokio-util = { workspace = true, features = ["io"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The cache's way to its upstreams, a trait its agent implements over the builder's protocol handler.
async-trait.workspace = true
# The agent: its infrastructure, its settings, its supervisor.
polar-agent-builder.workspace = true
polar-env.workspace = true
polar-scudo.workspace = true
ractor.workspace = true
cassini-types.workspace = true

[[bin]]
name = "polar-registry"
path = "src/main.rs"

[dev-dependencies]
# The protocol handler as an agent has it, for faults through it (tests/upstream.rs).
polar-agent-builder = { workspace = true, features = ["testing"] }
polar = { workspace = true }
# Blobs, archives and caches made and read back (tests/).
proptest.workspace = true
tempfile.workspace = true
reqwest.workspace = true
