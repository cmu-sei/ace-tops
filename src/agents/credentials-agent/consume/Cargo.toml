[package]
name = "credentials-agent-consumer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The authority key, P-256 (src/authority_key.rs).
p256 = { workspace = true, features = ["pem"] }
zeroize = { version = "1.9.0", features = ["aarch64"] }
polar-scudo.workspace = true
attestation-common.workspace = true
cassini-backoff.workspace = true
cassini-client.workspace = true
cassini-types.workspace = true
cert-client = { path = "../../cert-issuer/client" }
cert-issuer-common = { path = "../../cert-issuer/common" }
credentials_agent_common.workspace = true
credentials-agent-model.workspace = true
jwt_utils.workspace = true
neo4rs.workspace = true
polar.workspace = true
polar-log.workspace = true
minicbor.workspace = true
polar-version.workspace = true
hex.workspace = true
polar-agent-builder.workspace = true
# The projection's graph is given the agent's TLS, its crypto actor's (src/projection.rs).
rustls.workspace = true
polar-env.workspace = true
# The git server's evidence topics: this agent sends its revocation records there (src/revocation_evidence.rs).
polar-git-server-common.workspace = true
polar-permissions.workspace = true
polar-policy.workspace = true
ractor.workspace = true
rand.workspace = true
reqwest.workspace = true
rkyv.workspace = true
rsa.workspace = true
# polar-ledger checks a ledger's checkpoint certificate (src/ledger_reader.rs).
polar-signing.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
attestation-common = { workspace = true, features = ["testing"] }
# A record key held by a crypto actor of its own, for the certifier's tests (src/authority_certificate.rs).
polar-agent-builder = { workspace = true, features = ["testing"] }
base64.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["test-util"] }
polar-signing = { workspace = true, features = ["testing"] }
polar-router.workspace = true
rcgen.workspace = true
time.workspace = true
wiremock.workspace = true
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }

[[bin]]
name = "credentials-agent-consumer"
path = "src/main.rs"

[[bin]]
name = "polar-ledger"
path = "src/bin/polar-ledger.rs"
