[package]
name = "polar-log"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Polar's signed, append-only logs: the entry envelope in deterministic CBOR, the RFC 9162 Merkle tree and its proofs, checkpoints in C2SP signed notes, and a file-backed log (docs/architecture/record-store.md)"

[dependencies]
base64.workspace = true
p256 = { workspace = true, features = ["pem"] }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
