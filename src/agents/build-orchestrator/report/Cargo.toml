# What a build reports, read so that no byte a build wrote can hurt Polar (docs/architecture/build-orchestrator.md,
# "How a report is read"), its gate and parser proved with Verus ("Proved with Verus"): `cargo verus verify -p
# orchestrator-report`, in the dev shell. Its one dependency is Verus's library of specifications, erased from a plain build.
[package]
name = "orchestrator-report"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "orchestrator_report"
path = "src/lib.rs"

[dependencies]
vstd.workspace = true

[package.metadata.verus]
verify = true

[dev-dependencies]
proptest.workspace = true
# The builder's worker, to run the reader's answer in one as the agent will (tests/worker.rs): for the tests alone.
polar-agent-builder.workspace = true

# A worker is forked only from a process of one thread, and libtest runs tests on threads of its own.
[[test]]
name = "worker"
harness = false
