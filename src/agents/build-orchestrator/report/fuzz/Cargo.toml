# DM26-0670


# Coverage-guided fuzzing of the report reader (docs/architecture/build-orchestrator.md, "How a report is read"): its own
# workspace, so that libfuzzer-sys is no dependency of Polar's. `cargo fuzz run read -- -max_total_time=600`, with cargo-fuzz
# (nixpkgs) on the workspace's nightly.
[package]
name = "orchestrator-report-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
orchestrator-report = { path = ".." }

[[bin]]
name = "read"
path = "fuzz_targets/read.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
