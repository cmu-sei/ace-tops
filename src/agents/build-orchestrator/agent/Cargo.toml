[package]
name = "build-orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cassini-client.workspace = true
cassini-types.workspace = true
chrono.workspace = true
flate2.workspace = true
futures.workspace = true
# To read the clone the git handler brought up to date, and nothing more: clippy.toml forbids the rest.
git2.workspace = true
git-agent-common.workspace = true
orchestrator-backend-k8s.workspace = true
orchestrator-core.workspace = true
orchestrator-report.workspace = true
polar.workspace = true
polar-agent-builder.workspace = true
polar-env.workspace = true
polar-scudo.workspace = true
ractor.workspace = true
rkyv.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
# The fetch's own client, as the build's pod reads the registry (tests/cargo.rs).
reqwest.workspace = true
# The fetch's own unpacking, which a build's pod runs on the archive.
build-fetch = { path = "../fetch" }
tempfile.workspace = true
proptest.workspace = true
# The real HTTP protocol, over a stand-in registry (polar_agent_builder::protocol::testing).
polar-agent-builder = { workspace = true, features = ["testing"] }
wiremock.workspace = true

[[bin]]
name = "build-orchestrator"
path = "src/main.rs"

# Forks the reader, which needs a process of one thread: its own main, not libtest's.
[[test]]
name = "reader"
harness = false
