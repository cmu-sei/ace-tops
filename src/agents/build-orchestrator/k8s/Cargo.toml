[package]
name = "orchestrator-backend-k8s"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
k8s-openapi.workspace = true
polar-agent-builder.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true
orchestrator-core.workspace = true
# A pod's log comes as a stream to an actor (ProtocolHandle::stream), handed on a piece at a time (backend.rs, `Tap`).
ractor.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
[lib]
name = "orchestrator_backend_k8s"
path = "src/lib.rs"

[dev-dependencies]
proptest.workspace = true
# The real Kubernetes protocol, over a stand-in API (polar_agent_builder::protocol::testing).
polar-agent-builder = { workspace = true, features = ["testing"] }
tokio.workspace = true
