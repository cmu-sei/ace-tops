[package]
name = "polar-git"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "polar-git"
path = "src/main.rs"

[dependencies]
polar-scudo.workspace = true
# A client's certificate, as PEM, for the policy actor (src/edge.rs).
base64.workspace = true
axum = "0.7"
bytes.workspace = true
cassini-client.workspace = true
cassini-types.workspace = true
gix.workspace = true
gix-serve.workspace = true
polar-agent-builder.workspace = true
# The server certificate's variable, which the crypto actor's `keys` section declares (src/settings.rs).
polar-crypto.workspace = true
polar-env.workspace = true
# git's transport, the TLS listener and the repository store, shared with the record store rather than copied
# (docs/architecture/polar-git.md).
polar-git-server = { path = "../polar-git-server/server" }
# The rule each git operation is asked under, and the policy actor that answers (src/edge.rs).
polar-policy.workspace = true
ractor.workspace = true
rkyv.workspace = true
thiserror.workspace = true
# A person's username, from their certificate's Subject, for what is reported (src/edge.rs).
x509-parser.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true

[dev-dependencies]
polar-permissions.workspace = true
rcgen.workspace = true
tempfile.workspace = true
