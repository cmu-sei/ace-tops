# The Cassini command-line client and its daemon (`cassini-client`), apart from the client library so that it can start a
# crypto actor of its own, which makes its TLS (docs/plans/crypto-actor.md): polar-crypto depends on the library.
[package]
name = "cassini-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cassini_cli"
path = "src/lib.rs"

[[bin]]
name = "cassini-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
cassini-client.workspace = true
cassini-tracing.workspace = true
cassini-types.workspace = true
chrono.workspace = true
clap.workspace = true
polar-crypto.workspace = true
polar-scudo.workspace = true
polar-version.workspace = true
ractor.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
