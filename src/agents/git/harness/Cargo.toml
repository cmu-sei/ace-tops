# A one-off harness that proposes a repository, or publishes synthetic git events, as an observer would
# (src/main.rs). Apart from the git observer so that its own crypto actor, which makes its TLS, is not a way out of
# the observer's domain (polar-agent-builder/tests/domain_has_no_way_out.rs).
[package]
name = "git-discovery-harness"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "git-discovery-harness"
path = "src/main.rs"

[dependencies]
cassini-client.workspace = true
cassini-types.workspace = true
git-agent-common.workspace = true
polar.workspace = true
polar-crypto.workspace = true
polar-env.workspace = true
polar-scudo.workspace = true
polar-version.workspace = true
ractor.workspace = true
rkyv.workspace = true
tokio.workspace = true
tracing.workspace = true
