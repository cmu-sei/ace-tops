# DM26-0670

# One project's jobs, ten to a page, each with its pipeline and the runner that ran it.
query ProjectJobs($fullPath: ID!, $after: String) {
  project(fullPath: $fullPath) {
    id
    jobs(first: 10, after: $after) {
      nodes {
        id
        name
        status
        stage {
          name
        }
        createdAt
        finishedAt
        duration
        pipeline {
          id
        }
        runner {
          id
        }
      }
      pageInfo {
        endCursor
        hasNextPage
      }
    }
  }
}
